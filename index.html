<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Hi Manta 優化版 Demo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&family=Montserrat:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ocean:#2f6fae; --ocean-d:#1f4f80; --ocean-l:#e8f1fa; --sea:#3fa7a3; --sea-l:#e3f4f2;
  --coral:#f0775a; --coral-l:#fdeee9; --sun:#f2b544; --sun-l:#fdf4e1;
  --ink:#24323f; --ink-2:#5b6b7a; --ink-3:#93a1ae; --line:#e3e9ef; --bg:#f4f7fa; --card:#fff;
  --ok:#2e9e6a; --ok-l:#e5f5ec;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:"Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink);min-height:100vh}
.num{font-family:Montserrat,sans-serif}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}

/* ---------- layout ---------- */
.stage{display:flex;justify-content:center;align-items:center;min-height:100vh;padding:32px 16px}
.switch{font-size:12px;color:var(--ocean);background:var(--ocean-l);border-radius:14px;padding:5px 10px;font-weight:500}
.side{flex:1;max-width:460px;position:sticky;top:24px}
.side h1{font-size:22px;line-height:1.4;margin-bottom:6px}
.side .sub{color:var(--ink-2);font-size:14px;margin-bottom:20px;line-height:1.7}
.mode{display:inline-flex;background:#fff;border:1px solid var(--line);border-radius:10px;padding:3px;margin-bottom:18px}
.mode button{padding:7px 14px;border-radius:8px;font-size:14px;color:var(--ink-2)}
.mode button.on{background:var(--ocean);color:#fff}
.note{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px}
.note h2{font-size:16px;margin-bottom:14px;display:flex;align-items:center;gap:8px}
.note h2 .tag{font-size:12px;background:var(--ocean-l);color:var(--ocean);padding:2px 8px;border-radius:6px;font-weight:500}
.pair{display:grid;grid-template-columns:1fr;gap:6px;padding:12px 0;border-top:1px dashed var(--line)}
.pair:first-of-type{border-top:0;padding-top:0}
.pair .before{font-size:13px;color:var(--ink-3);text-decoration:line-through;text-decoration-color:#c9d2da}
.pair .after{font-size:14px;line-height:1.65}
.pair .after b{color:var(--ocean-d)}
.legend{font-size:12px;color:var(--ink-3);margin-top:14px;line-height:1.7}

/* ---------- phone ---------- */
.phone{width:390px;height:800px;background:#fff;border-radius:44px;box-shadow:0 20px 50px rgba(31,79,128,.16),0 0 0 10px #1c2733;position:relative;overflow:hidden;flex-shrink:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg)}
.appbar{height:68px;padding-top:16px !important;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:#fff;border-bottom:1px solid var(--line);flex-shrink:0}
.appbar .brand{display:flex;align-items:center;gap:8px;font-weight:700}
.logo{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--ocean),var(--sea));display:grid;place-items:center;color:#fff;font-size:15px}
.appbar .title{font-size:17px;font-weight:700}
.bell{position:relative;width:34px;height:34px;display:grid;place-items:center;border-radius:50%}
.bell .dot{position:absolute;top:6px;right:7px;width:8px;height:8px;border-radius:50%;background:var(--coral);border:2px solid #fff}
.content{flex:1;overflow-y:auto;padding:16px 16px 24px}
.content::-webkit-scrollbar{width:0}
.tabbar{height:72px;display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:12px;flex-shrink:0}
.tabbar button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--ink-3)}
.tabbar button.on{color:var(--ocean)}
.tabbar svg{width:23px;height:23px}
.tabbar .badge{position:absolute;margin:-18px 0 0 22px;background:var(--coral);color:#fff;font-size:10px;border-radius:9px;padding:0 5px;line-height:16px}

/* ---------- components ---------- */
.card{background:var(--card);border-radius:14px;padding:16px;margin-bottom:12px;border:1px solid var(--line)}
.sec{display:flex;justify-content:space-between;align-items:baseline;margin:18px 2px 10px}
.sec h3{font-size:16px}
.sec a{font-size:13px;color:var(--ocean);cursor:pointer}
.hero{background:linear-gradient(135deg,var(--ocean) 0%,var(--sea) 100%);color:#fff;border-radius:18px;padding:18px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.12);filter:blur(10px)}
.hero .row{display:flex;align-items:center;gap:12px}
.avatar{width:48px;height:48px;border-radius:50%;background:#ffd9c9;display:grid;place-items:center;font-size:22px;border:2px solid rgba(255,255,255,.7);flex-shrink:0}
.hero .hi{font-size:13px;opacity:.85}
.hero .name{font-size:19px;font-weight:700}
.lv{display:flex;justify-content:space-between;font-size:12px;margin:16px 0 6px;opacity:.95}
.bar{height:8px;background:rgba(255,255,255,.25);border-radius:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--sun);border-radius:6px}
.bar.dark{background:var(--line)}
.bar.dark i{background:var(--sea)}
.next{display:flex;gap:12px;align-items:center;background:var(--sun-l);border:1px solid #f5dfae;border-radius:14px;padding:14px;margin-top:12px}
.next .ic{width:40px;height:40px;border-radius:12px;background:#fff;display:grid;place-items:center;font-size:20px;flex-shrink:0}
.next .t{font-weight:700;font-size:14px}
.next .d{font-size:12px;color:var(--ink-2);margin-top:2px}
.btn{background:var(--ocean);color:#fff;border-radius:10px;padding:10px 14px;font-size:14px;font-weight:500;white-space:nowrap}
.btn.sm{padding:7px 12px;font-size:13px}
.btn.ghost{background:var(--ocean-l);color:var(--ocean)}
.btn.coral{background:var(--coral)}
.btn.ok{background:var(--ok)}
.btn.block{width:100%;padding:13px}
.btn:disabled{background:var(--line);color:var(--ink-3);cursor:not-allowed}
.chips{display:flex;gap:8px;overflow-x:auto;margin-bottom:12px;padding-bottom:2px}
.chips::-webkit-scrollbar{height:0}
.chip{padding:6px 12px;border-radius:20px;background:#fff;border:1px solid var(--line);font-size:13px;white-space:nowrap;color:var(--ink-2)}
.chip.on{background:var(--ocean);border-color:var(--ocean);color:#fff}
.pill{display:inline-block;font-size:11px;padding:2px 8px;border-radius:6px;font-weight:500}
.p-ok{background:var(--ok-l);color:var(--ok)}
.p-ocean{background:var(--ocean-l);color:var(--ocean)}
.p-coral{background:var(--coral-l);color:#c9553a}
.p-sun{background:var(--sun-l);color:#a87410}
.p-gray{background:#eef1f4;color:var(--ink-2)}
.p-sea{background:var(--sea-l);color:#26807c}
.sess{display:flex;gap:12px}
.date{width:52px;flex-shrink:0;text-align:center;background:var(--ocean-l);border-radius:12px;padding:8px 0;color:var(--ocean-d)}
.date .m{font-size:11px}
.date .d{font-size:22px;font-weight:700;line-height:1.1}
.date .w{font-size:11px}
.sess .info{flex:1;min-width:0}
.sess .nm{font-weight:700;font-size:15px}
.meta{font-size:12px;color:var(--ink-2);margin-top:3px;line-height:1.6}
.seats{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--ink-2)}
.seats .bar{flex:1;height:6px}
.foot{display:flex;justify-content:space-between;align-items:center;margin-top:12px}
.trip{padding:0;overflow:hidden}
.trip .cover{height:118px;display:flex;align-items:flex-end;padding:12px;color:#fff;font-size:12px;position:relative}
.trip .cover .pill{background:rgba(255,255,255,.92)}
.trip .body{padding:14px 16px}
.trip .tt{font-weight:700;font-size:15px;line-height:1.45}
.alert{display:flex;gap:10px;padding:12px 14px;border-radius:12px;font-size:13px;line-height:1.6;margin-bottom:12px}
.alert.safe{background:var(--coral-l);color:#8f3b26;border:1px solid #f7cfc3}
.alert.info{background:var(--ocean-l);color:var(--ocean-d)}
.task{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0;padding-top:0}
.task .em{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.task .tn{font-weight:500;font-size:14px}
.task .ts{font-size:12px;color:var(--ink-2);margin-top:2px}
.task .r{margin-left:auto;text-align:right;flex-shrink:0}
.done-btn{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;font-weight:700}
.done-btn.on{background:var(--sea);border-color:var(--sea);color:#fff}
.badges{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.bdg{text-align:center;font-size:11px;color:var(--ink-2)}
.bdg .ico{width:56px;height:56px;margin:0 auto 6px;border-radius:50%;display:grid;place-items:center;font-size:24px;background:var(--bg);border:2px dashed var(--line)}
.bdg.got .ico{background:linear-gradient(135deg,var(--sun-l),#fff);border:2px solid var(--sun)}
.list-row{display:flex;align-items:center;gap:12px;padding:13px 0;border-top:1px solid var(--line);font-size:14px;cursor:pointer}
.list-row:first-child{border-top:0}
.list-row .em{font-size:18px;width:26px;text-align:center}
.list-row .chev{margin-left:auto;color:var(--ink-3)}
.stat3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:12px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;text-align:center}
.stat .v{font-size:22px;font-weight:700;color:var(--ocean-d)}
.stat .l{font-size:11px;color:var(--ink-2);margin-top:2px}
.q-item{display:flex;gap:12px;align-items:flex-start;padding:14px 0;border-top:1px solid var(--line)}
.q-item:first-child{border-top:0;padding-top:0}
.q-thumb{width:52px;height:52px;border-radius:10px;flex-shrink:0;display:grid;place-items:center;font-size:24px;background:var(--bg)}
.q-actions{display:flex;gap:6px;margin-top:8px}
.auto-log{font-size:12px;color:var(--ink-2);line-height:1.9}
.auto-log b{color:var(--ok)}
.kpi-row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line);font-size:13px}
.kpi-row:first-child{border-top:0}
.mini-bars{display:flex;align-items:flex-end;gap:6px;height:70px;margin-top:10px}
.mini-bars i{flex:1;background:var(--ocean-l);border-radius:4px 4px 0 0;position:relative}
.mini-bars i.hi{background:var(--ocean)}
.mini-lbl{display:flex;gap:6px;font-size:10px;color:var(--ink-3);margin-top:4px}
.mini-lbl span{flex:1;text-align:center}

/* steps */
.steps{display:flex;align-items:center;gap:6px;margin-bottom:16px}
.steps .s{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-3)}
.steps .s .n{width:22px;height:22px;border-radius:50%;background:var(--line);display:grid;place-items:center;font-size:12px;font-weight:700;color:#fff}
.steps .s.on{color:var(--ocean-d);font-weight:500}
.steps .s.on .n{background:var(--ocean)}
.steps .s.done .n{background:var(--sea)}
.steps .ln{flex:1;height:2px;background:var(--line)}
.field{margin-bottom:12px}
.back{font-size:24px;line-height:1;color:var(--ink);padding:2px 10px 4px 0}
.crumb{font-size:12px;color:var(--ink-3);margin:-4px 2px 12px}
.grp-host{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--ink-2);margin-top:8px}
.grp-host .av{width:22px;height:22px;border-radius:50%;background:var(--coral-l);display:grid;place-items:center;font-size:12px}
.field label{font-size:13px;color:var(--ink-2);display:block;margin-bottom:6px}
.field input,.field select{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font:inherit;font-size:14px;background:#fff;color:var(--ink)}
.opt{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;margin-bottom:8px;cursor:pointer;font-size:14px}
.opt.on{border-color:var(--ocean);background:var(--ocean-l)}
.opt .pr{font-weight:700;color:var(--ocean-d)}
.sum{display:flex;justify-content:space-between;font-size:14px;padding:6px 0}
.sum.total{font-weight:700;font-size:16px;border-top:1px solid var(--line);margin-top:6px;padding-top:12px}

/* sheet & toast */
.mask{position:absolute;inset:0;background:rgba(20,35,50,.42);opacity:0;pointer-events:none;transition:.2s;z-index:20}
.mask.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;background:#fff;border-radius:22px 22px 0 0;padding:10px 18px 26px;transform:translateY(105%);transition:.28s cubic-bezier(.2,.8,.2,1);z-index:21;max-height:86%;overflow-y:auto}
.sheet.on{transform:translateY(0)}
.sheet .grab{width:40px;height:5px;background:var(--line);border-radius:3px;margin:0 auto 14px}
.sheet h4{font-size:17px;margin-bottom:4px}
.gear{display:flex;align-items:center;justify-content:space-between;padding:10px 0;border-top:1px solid var(--line);font-size:14px}
.gear:first-of-type{border-top:0}
.stepper{display:flex;align-items:center;gap:10px}
.stepper button{width:28px;height:28px;border-radius:50%;background:var(--bg);font-size:16px;color:var(--ocean)}
.toast{position:absolute;left:16px;right:16px;top:100px;background:#1f3446;color:#fff;border-radius:14px;padding:13px 16px;font-size:13px;line-height:1.6;display:flex;gap:10px;align-items:flex-start;z-index:30;transform:translateY(-20px);opacity:0;transition:.25s;pointer-events:none}
.toast.on{transform:none;opacity:1}
.toast .line{background:#06c755;color:#fff;font-size:10px;font-weight:700;border-radius:5px;padding:2px 5px;flex-shrink:0;margin-top:2px}
.empty{text-align:center;color:var(--ink-3);font-size:13px;padding:24px 0}
.ok-big{text-align:center;padding:18px 0 6px}
.ok-big .c{width:64px;height:64px;border-radius:50%;background:var(--ok-l);color:var(--ok);display:grid;place-items:center;font-size:30px;margin:0 auto 12px}
.demo-tag{font-size:11px;color:var(--ink-3);text-align:center;margin-top:16px}

@media (max-width:430px){
  .stage{padding:0;min-height:0;display:block}
  .phone{width:100%;height:100svh;border-radius:0;box-shadow:none}
  .appbar{height:52px;padding-top:0 !important}
}
</style>
</head>

/* ================= helpers ================= */
const $=s=>document.querySelector(s);
const money=n=>'NT$ '+n.toLocaleString('en-US');
const level=e=>{const t=[[0,'海綿寶寶'],[500,'珊瑚獵人'],[2000,'深海探險家'],[5000,'海洋征服者']];let cur=t[0],nx=null;for(let i=0;i<t.length;i++){if(e>=t[i][0]){cur=t[i];nx=t[i+1]||null}}return{name:cur[1],next:nx,from:cur[0]}};
let toastT;
function toast(msg,line=true){const el=$('#toast');el.innerHTML=(line?'<span class="line">LINE</span>':'')+'<span>'+msg+'</span>';el.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('on'),2800)}
function openSheet(html){$('#sheet').innerHTML='<div class="grab"></div>'+html;$('#sheet').classList.add('on');$('#mask').classList.add('on')}
function closeSheet(){$('#sheet').classList.remove('on');$('#mask').classList.remove('on')}
$('#mask').onclick=closeSheet;

/* ================= render ================= */
const TABS={student:[['home','首頁'],['book','預約'],['task','任務'],['trip','潛旅'],['me','我的']],coach:[['queue','審核中心'],['dash','經營儀表板']]};

function render(){
  const tabs=TABS[S.mode];
  if(!tabs.find(t=>t[0]===S.tab)) S.tab=tabs[0][0];
  const tb=$('#tabbar');
  tb.style.gridTemplateColumns=`repeat(${tabs.length},1fr)`;
  tb.innerHTML=tabs.map(([k,l])=>`<button data-tab="${k}" class="${S.tab===k?'on':''}" style="position:relative">${I[k]}${k==='queue'&&S.queue.length?`<span class="badge num">${S.queue.length}</span>`:''}<span>${l}</span></button>`).join('');
  tb.querySelectorAll('button').forEach(b=>b.onclick=()=>{S.tab=b.dataset.tab;S.sub=null;S.tripBooking=null;render();$('#content').scrollTop=0});
  const titles={home:'',book:'團練預約',task:'任務與徽章',trip:'潛旅',me:'我的',queue:'審核中心',dash:'經營儀表板'};
  $('#appbar').innerHTML=S.tab==='home'
    ?`<div class="brand"><div class="logo">🐟</div>Hi Manta</div><div style="display:flex;align-items:center;gap:4px">${`<button class="switch" onclick="setMode('${S.mode==='student'?'coach':'student'}')">${S.mode==='student'?'切換教練視角':'切換學員視角'}</button>`}<button class="bell" onclick="toast('明天 14:00 墾丁小灣團練，記得帶防寒衣與配重。')">${I.bell}<span class="dot"></span></button></div>`
    :`<div class="title">${titles[S.tab]}</div>${`<button class="switch" onclick="setMode('${S.mode==='student'?'coach':'student'}')">${S.mode==='student'?'切換教練視角':'切換學員視角'}</button>`}`;
  if(S.sub){
    $('#appbar').innerHTML=`<div style="display:flex;align-items:center"><button class="back" data-subback aria-label="返回">‹</button><div class="title">${SUBS[S.sub].title}</div></div><button class="switch" onclick="setMode('${S.mode==='student'?'coach':'student'}')">${S.mode==='student'?'切換教練視角':'切換學員視角'}</button>`;
    $('#appbar').querySelector('[data-subback]').onclick=()=>{const f=S.from;S.sub=null;S.tab=f||S.tab;render();$('#content').scrollTop=0};
  }
  $('#content').innerHTML=S.sub?SUBS[S.sub].view():VIEWS[S.tab]();
  bind();
}

function sessCard(s){
  const mine=S.booked.includes(s.id), wl=S.waitlist.includes(s.id), full=s.taken>=s.cap;
  const left=s.cap-s.taken;
  let action;
  if(mine) action=`<span class="pill p-ok">已確認</span>`;
  else if(wl) action=`<span class="pill p-sun">候補中・第 1 位</span>`;
  else if(full) action=`<button class="btn sm ghost" data-wait="${s.id}">加入候補</button>`;
  else action=`<button class="btn sm" data-book="${s.id}">預約</button>`;
  return `<div class="card"><div class="sess">
    <div class="date"><div class="m">${s.m}</div><div class="d num">${s.d}</div><div class="w">${s.w}</div></div>
    <div class="info"><div class="nm">${s.loc}</div><div class="meta">${s.type}・${s.time}<br>${s.coach}・${s.level}</div>
      <div class="seats"><div class="bar dark"><i style="width:${s.taken/s.cap*100}%;${full?'background:var(--coral)':''}"></i></div><span>${full?'已額滿':'剩 '+left+' 位'}</span></div>
    </div></div>
    <div class="foot"><span class="meta" style="margin:0">場地費 <b class="num">${money(s.fee)}</b>・現場收取</span>${action}</div></div>`;
}

function tripCard(t){
  const full=t.taken>=t.cap;
  const booked=S.tripBooking&&S.tripBooking.done&&S.tripBooking.id===t.id;
  return `<div class="card trip"><div class="cover" style="background:linear-gradient(135deg,${t.grad[0]},${t.grad[1]})"><span class="pill ${full?'p-coral':t.status==='已成團'?'p-ok':'p-ocean'}">${t.status}</span></div>
    <div class="body"><div class="tt">${t.t}</div><div class="meta">${t.when}・${t.days}・${t.place}</div>
    <div class="seats"><div class="bar dark"><i style="width:${t.taken/t.cap*100}%"></i></div><span>${t.taken}/${t.cap} 人</span></div>
    <div class="foot"><span style="font-weight:700;color:var(--ocean-d)" class="num">${money(t.price)}<span class="meta" style="font-weight:400"> 起</span></span>
    ${booked?'<span class="pill p-sea">已報名</span>':`<button class="btn sm ${full?'ghost':''}" data-trip="${t.id}">${full?'加入候補':'立即報名'}</button>`}</div></div></div>`;
}

    <div style="display:flex;gap:8px"><button class="btn ghost" data-next="1">上一步</button><button class="btn block" data-next="3">下一步</button></div>`;
  if(b.step===3) body=`
    <div class="card" style="background:var(--bg)">
      <div class="sum"><span>${plans[b.plan][0]}</span><span class="num">${money(plans[b.plan][1])}</span></div>
      <div class="sum"><span>本次先付訂金</span><span class="num">${money(t.dep)}</span></div>
      <div class="sum total"><span>尾款（出發前 30 天）</span><span class="num">${money(plans[b.plan][1]-t.dep)}</span></div>
    </div>
    <div class="meta" style="margin-bottom:10px">匯款帳號：示意銀行（000）0000-000-000000</div>
    <div class="field"><label>匯款帳號末五碼</label><input id="last5" maxlength="5" placeholder="例：12345" inputmode="numeric"></div>
    <div style="display:flex;gap:8px"><button class="btn ghost" data-next="2">上一步</button><button class="btn block coral" id="paydone">送出報名</button></div>
    <p class="meta" style="margin-top:10px">送出後名額會先為你保留 48 小時，店家對帳完成會 LINE 通知並拉你進行程群組。</p>`;
  return `<button class="meta" data-back style="margin-bottom:10px">‹ 返回潛旅列表</button>
    <div style="font-weight:700;font-size:16px;line-height:1.45">${t.t}</div><div class="meta" style="margin-bottom:14px">${t.when}・剩 ${t.cap-t.taken} 個名額</div>
    <div class="steps">${st(1,'方案')}<span class="ln"></span>${st(2,'資料')}<span class="ln"></span>${st(3,'訂金')}</div>
    ${body}`;
}

const SUBS={
group:{title:'揪團',view(){
  const f=S.groupFilter, list=S.groups.filter(g=>g.cat===f);
  return `<div class="crumb">${S.from==='home'?'首頁':'我的'} › 揪團　<span style="color:var(--ink-3)">（不在底部導覽，從${S.from==='home'?'首頁卡片':'「我的」'}進入，左上角返回）</span></div>
  <div class="chips">${['潛水活動','社群活動'].map(c=>`<button class="chip ${f===c?'on':''}" data-gf="${c}">${c}</button>`).join('')}</div>
  ${f==='社群活動'?'<div class="alert info">社群活動另外分類，預設只看潛水活動，找下水夥伴更快。</div>':''}
  ${list.map(g=>{const full=g.taken>=g.cap, j=S.joined.includes(g.id);
    return `<div class="card"><div style="display:flex;gap:12px"><div style="font-size:26px">${g.em}</div><div style="flex:1;min-width:0">
      <div style="font-weight:700;font-size:15px">${g.t}</div>
      <div class="meta">${g.when}・${g.where}</div>
      <div style="margin-top:6px"><span class="pill p-ocean">${g.lvl}</span> <span class="pill ${full?'p-gray':'p-ok'}">${full?'已額滿':'還差 '+(g.cap-g.taken)+' 人'}</span></div>
      <div class="grp-host"><span class="av">🙂</span>發起人 ${g.host}</div></div></div>
      <div style="margin-top:10px;text-align:right">${j?'<span class="pill p-ok">已加入・LINE 群組連結已傳送</span>':full?'<span class="pill p-gray">已額滿</span>':`<button class="btn sm" data-join="${g.id}">我要加入</button>`}</div></div>`}).join('')}
  <button class="btn block ghost" id="newGroup" style="margin-top:4px">＋ 發起揪團</button>
  <p class="meta" style="margin-top:8px;text-align:center">已認證證照的學員發起潛水活動，送出即上架，教練只會收到通知</p>`;
}},
};

/* ================= interactions ================= */
function bind(){
  const c=$('#content');
  c.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.go;render();c.scrollTop=0});
  c.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>{S.sessFilter=b.dataset.filter;render()});
  c.querySelectorAll('[data-book]').forEach(b=>b.onclick=()=>bookSheet(b.dataset.book));
  c.querySelectorAll('[data-wait]').forEach(b=>b.onclick=()=>{S.waitlist.push(b.dataset.wait);render();toast('已加入候補第 1 位。有人取消會自動遞補，並用 LINE 通知你。')});
  c.querySelectorAll('[data-task]').forEach(b=>b.onclick=()=>{const t=S.tasks.find(x=>x.id===b.dataset.task);t.done=!t.done;S.exp+=t.done?t.exp:-t.exp;render();if(t.done)toast('+20 海洋值！今日訓練完成 '+S.tasks.filter(x=>x.done).length+'/'+S.tasks.length,false)});
  c.querySelectorAll('[data-trip]').forEach(b=>b.onclick=()=>{const t=S.trips.find(x=>x.id===b.dataset.trip);if(t.taken>=t.cap){toast('已加入「'+t.t.slice(0,8)+'」候補，有名額釋出會第一時間通知你。');b.outerHTML='<span class="pill p-sun">候補中</span>';return}S.tripBooking={id:t.id,step:1,plan:0,done:false};render();c.scrollTop=0});
  c.querySelectorAll('[data-plan]').forEach(b=>b.onclick=()=>{S.tripBooking.plan=+b.dataset.plan;render()});
  c.querySelectorAll('[data-next]').forEach(b=>b.onclick=()=>{S.tripBooking.step=+b.dataset.next;render();c.scrollTop=0});
  const back=c.querySelector('[data-back]'); if(back) back.onclick=()=>{S.tripBooking=null;render()};
  const pd=$('#paydone'); if(pd) pd.onclick=()=>{const v=$('#last5').value.trim();if(!/^\d{5}$/.test(v)){$('#last5').style.borderColor='var(--coral)';$('#last5').placeholder='請輸入 5 位數字';return}const t=S.trips.find(x=>x.id===S.tripBooking.id);t.taken++;S.tripBooking.done=true;S.tab='trip';render();
    openSheet(`<div class="ok-big"><div class="c">✓</div><h4>報名已送出</h4><p class="meta">名額已為你保留 48 小時<br>店家對帳後會 LINE 通知並拉你進群組</p></div><div class="card" style="background:var(--bg);margin-top:10px"><div class="meta">原本流程：私訊 IG → 外部表單 → 匯款 → 等待 → 進群組<br><b style="color:var(--ok)">現在：App 內 3 步完成，名額即時扣除</b></div></div><button class="btn block" onclick="closeSheet()">好的</button>`)};
  c.querySelectorAll('[data-qf]').forEach(b=>b.onclick=()=>{S.queueFilter=b.dataset.qf;render()});
  c.querySelectorAll('[data-approve]').forEach(b=>b.onclick=()=>{const q=S.queue.find(x=>x.id===b.dataset.approve);S.queue=S.queue.filter(x=>x!==q);render();toast('已核准，系統已 LINE 通知「'+q.who+'」。')});
  c.querySelectorAll('[data-reject]').forEach(b=>b.onclick=()=>rejectSheet(b.dataset.reject));
  const rm=$('#remind'); if(rm) rm.onclick=()=>{S.remindSent=true;render();toast('已發送 14 則邀請：「好久不見！這週六潛立方還有位置，要不要一起下水？」')};
  c.querySelectorAll('[data-sub]').forEach(b=>b.onclick=()=>{S.from=S.tab;S.sub=b.dataset.sub;render();c.scrollTop=0});
  c.querySelectorAll('[data-gf]').forEach(b=>b.onclick=()=>{S.groupFilter=b.dataset.gf;render()});
  c.querySelectorAll('[data-join]').forEach(b=>b.onclick=()=>{const g=S.groups.find(x=>x.id===b.dataset.join);g.taken++;S.joined.push(g.id);render();toast('已加入「'+g.t+'」，發起人與 LINE 群組連結已傳給你。')});
  const ng=$('#newGroup'); if(ng) ng.onclick=()=>toast('揪團已上架！你的 AIDA2 已認證，不用等審核。教練會收到一則通知。');
  c.querySelectorAll('[data-row]').forEach(b=>b.onclick=()=>{const n=b.dataset.row;if(n==='揪團'){S.from='me';S.sub='group';render();c.scrollTop=0}else if(n==='我的預約'){S.tab='book';render()}else if(n==='裝備選購'){gearSheet()}else toast('「'+n+'」沿用現有功能，從這裡進入。',false)});
}

function bookSheet(id){
  const s=S.sessions.find(x=>x.id===id);
  const gear=[['面鏡呼吸管',100],['長蛙鞋',200],['防寒衣',200],['配重帶',50]];
  const qty=gear.map(()=>0);
  const draw=()=>{const sum=gear.reduce((a,g,i)=>a+g[1]*qty[i],0);
    openSheet(`<h4>${s.m}${s.d}日 ${s.loc}</h4><div class="meta" style="margin-bottom:14px">${s.time}・${s.coach}・剩 ${s.cap-s.taken} 位</div>
    <div style="font-weight:700;font-size:14px;margin-bottom:4px">需要租借裝備嗎？</div>
    ${gear.map((g,i)=>`<div class="gear"><span>${g[0]}<span class="meta"> ${money(g[1])}</span></span><div class="stepper"><button data-m="${i}">−</button><span class="num">${qty[i]}</span><button data-p="${i}">＋</button></div></div>`).join('')}
    <div class="card" style="background:var(--bg);margin-top:12px"><div class="sum"><span>場地費</span><span class="num">${money(s.fee)}</span></div><div class="sum"><span>租借裝備</span><span class="num">${money(sum)}</span></div><div class="sum total"><span>現場合計</span><span class="num">${money(s.fee+sum)}</span></div></div>
    <p class="meta" style="margin-bottom:12px">開場前 24 小時內取消將記錄一次缺席。</p>
    <button class="btn block" id="confirmBook">確認預約</button>`);
    $('#sheet').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{qty[b.dataset.p]++;draw()});
    $('#sheet').querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{qty[b.dataset.m]=Math.max(0,qty[b.dataset.m]-1);draw()});
    $('#confirmBook').onclick=()=>{S.booked.push(id);s.taken++;closeSheet();render();toast('預約成功，已即時確認！'+s.m+s.d+'日 '+s.time+' '+s.loc+'，前一天會再提醒你。')};
  };
  draw();
}

function rejectSheet(id){
  const q=S.queue.find(x=>x.id===id);
  const rs=['照片看不清楚，請重新上傳','與徽章條件不符','資訊不完整，請補充後再送出'];
  openSheet(`<h4>退回：${q.who}｜${q.what}</h4><div class="meta" style="margin-bottom:14px">選一個理由，系統會自動 LINE 通知學員</div>
    ${rs.map((r,i)=>`<div class="opt" data-r="${i}">${r}</div>`).join('')}`);
  $('#sheet').querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>{S.queue=S.queue.filter(x=>x!==q);closeSheet();render();toast('已退回並通知「'+q.who+'」：'+rs[b.dataset.r])});
}

function gearSheet(){
  const items=[['Hi Manta 自潛面鏡',950,'🤿'],['Hi Manta 呼吸管',250,'🫧'],['Hi Manta 毛巾衣',1480,'🧥']];
  openSheet(`<h4>裝備選購</h4><div class="meta" style="margin-bottom:12px">按「我有興趣」，店家會主動聯絡你確認尺寸與庫存</div>
    ${items.map(([n,p,e],i)=>`<div class="gear"><span>${e} ${n}<br><span class="meta num">${money(p)}</span></span><button class="btn sm ghost" data-int="${i}">我有興趣</button></div>`).join('')}`);
  $('#sheet').querySelectorAll('[data-int]').forEach(b=>b.onclick=()=>{b.outerHTML='<span class="pill p-ok">已通知店家</span>';toast('店家已收到你的詢問，會透過 LINE 與你聯繫。')});
}

function setMode(m){S.mode=m;S.sub=null;S.tab=TABS[m][0][0];S.tripBooking=null;closeSheet();render();$('#content').scrollTop=0}

render();
</script>
